server:
  port: 81

spring:
  profiles:
    active: dev
    default: dev
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://svc-dev:3306/mydata_dev_0.9?useSSL=false&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&transformedBitIsBoolean=true&serverTimezone=GMT%2B8&nullCatalogMeansCurrent=true&allowPublicKeyRetrieval=true&autoReconnect=true&failOverReadOnly=false
    username: root
    password: root
  jackson:
    time-zone: GMT+8
  #    date-format: yyyy-MM-dd HH:mm:ss
  data:
    # redis 配置
    redis:
      host: svc-dev
      port: 6379
      database: 0
      password:
    # mongodb 配置
    mongodb:
      uri: mongodb://root:root@svc-dev:27017/admin
  quartz:
    job-store-type: memory

# frostmetal
frostmetal:
  tenant:
    ignore-tables:
      - sys_tenant
  secure:
    auth:
      # 启用token认证拦截
      enabled: true
      # 自定义放行地址
      skip-url:
        - /demo/**

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'zhiwei'
      paths-to-match: '/**'
      packages-to-scan: tech.zhiwei

# Sa-Token 配置
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: true
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

#配置日志地址
logging:
  config: classpath:log/logback_${spring.profiles.active}.xml

#mydata配置
mydata:
  mongodb:
    url: mongodb://root:root@svc-dev:27017/{}?authSource=admin&ssl=false
  secure:
    encrypt-db: false